<style>
  :root{
    --olive:#404A3B;
    --gold:#C8A96A;
    --cream:#FEF9F3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    font-family:'Raleway',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--olive);
    color:var(--cream);
    min-height:100dvh;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;position:relative;
  }
  ::selection{background:var(--gold);color:var(--olive)}

  /* soft, high-end depth: faint glow above, gentle shade below */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(1100px 700px at 50% -12%,rgba(254,249,243,.045),transparent 60%),
      radial-gradient(900px 620px at 50% 118%,rgba(0,0,0,.16),transparent 62%);
  }

  /* whisper-quiet 93 monogram */
  .monogram{
    position:fixed;right:-3vw;bottom:-14vh;line-height:.8;
    font-size:56vh;font-weight:200;letter-spacing:-.06em;
    color:rgba(254,249,243,.035);user-select:none;pointer-events:none;
  }

  main{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;
    padding:clamp(2.5rem,7vw,5rem) clamp(1.5rem,6vw,3rem);
    position:relative;z-index:1;
  }
  .logo{
    width:clamp(140px,24vw,200px);height:auto;display:block;
    margin-bottom:clamp(2.2rem,5vh,3.2rem);
  }
  .rule{
    width:64px;height:1px;margin:0 auto clamp(1.6rem,3.5vh,2.4rem);
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .kicker{
    font-size:.7rem;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);margin-bottom:clamp(1.1rem,2.5vh,1.6rem);
    padding-left:.42em; /* optically recentre letterspaced caps */
  }
  h1{
    font-weight:200;letter-spacing:.01em;
    font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.18;
    margin-bottom:clamp(1.1rem,2.5vh,1.7rem);
  }
  .lede{
    max-width:36ch;font-size:clamp(.95rem,1.5vw,1.06rem);font-weight:400;
    line-height:1.75;color:rgba(254,249,243,.78);
  }
  .lede .client{color:var(--cream);font-weight:500}

  /* Optional per-client contact line — see ✏️ EDIT block below */
  .contact{
    margin-top:clamp(1.4rem,3vh,2rem);
    font-size:.85rem;color:rgba(254,249,243,.62);
  }
  .contact a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(200,169,106,.4);padding-bottom:2px}
  .contact a:hover{border-bottom-color:var(--gold)}

  footer{
    position:relative;z-index:1;text-align:center;
    padding:0 clamp(1.5rem,6vw,3rem) clamp(2rem,5vh,3rem);
  }
  .socials{display:flex;justify-content:center;gap:1.5rem;margin-bottom:1.1rem}
  .socials a{
    display:inline-flex;color:rgba(254,249,243,.62);
    transition:color .25s ease,transform .25s ease;
  }
  .socials a:hover{color:var(--gold);transform:translateY(-2px)}
  .socials svg{width:17px;height:17px;fill:currentColor;display:block}
  .credit{font-size:.8rem;font-weight:400;letter-spacing:.02em;color:rgba(254,249,243,.55)}
  .credit a{
    color:var(--gold);font-weight:600;text-decoration:none;
    border-bottom:1px solid rgba(200,169,106,.45);padding-bottom:2px;
    transition:border-color .25s ease,color .25s ease;
  }
  .credit a:hover{color:#D9BC82;border-bottom-color:var(--gold)}

  /* one-time entrance */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .logo,.rule,.kicker,h1,.lede,.contact,footer{animation:rise .9s cubic-bezier(.22,.75,.25,1) both}
  .logo{animation-delay:.05s}
  .rule{animation-delay:.2s}
  .kicker{animation-delay:.32s}
  h1{animation-delay:.44s}
  .lede{animation-delay:.58s}
  .contact{animation-delay:.68s}
  footer{animation-delay:.8s}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-width:560px){.monogram{font-size:46vh;right:-8vw;bottom:-16vh}}
</style>
</head>
